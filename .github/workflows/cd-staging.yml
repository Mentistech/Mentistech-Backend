name: MentisTech CD — Staging

on:
  push:
    branches: [develop]

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────
  # JOB 1 — Build e push da imagem Docker
  # ─────────────────────────────────────
  build-and-push:
    name: Build e push imagem (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-,format=short

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────
  # JOB 2 — Deploy no servidor de staging
  # ─────────────────────────────────────
  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Deploy via SSH no servidor de staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            echo "==> Autenticando no registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Puxando nova imagem..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop

            echo "==> Rodando migrations..."
            docker run --rm \
              --env DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop \
              npx prisma migrate deploy

            echo "==> Reiniciando container..."
            docker stop mentistech-staging 2>/dev/null || true
            docker rm   mentistech-staging 2>/dev/null || true
            docker run -d \
              --name mentistech-staging \
              --restart unless-stopped \
              -p 3000:3000 \
              --env NODE_ENV=staging \
              --env DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              --env JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
              --env ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --env FRONTEND_URL="${{ vars.STAGING_FRONTEND_URL }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop

            echo "==> Aguardando health check..."
            sleep 10
            docker exec mentistech-staging \
              wget -qO- http://localhost:3000/health || exit 1

            echo "==> Deploy de staging concluído com sucesso!"

      - name: Resumo do deploy no job summary
        run: |
          echo "## Deploy Staging — Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`develop\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ vars.STAGING_URL }} |" >> $GITHUB_STEP_SUMMARY
