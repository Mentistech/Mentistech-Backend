name: MentisTech CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────
  # JOB 1 — Instalar dependências
  # ─────────────────────────────────────
  dependencies:
    name: Instalar dependências
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  # ─────────────────────────────────────
  # JOB 2 — Testes unitários
  # ─────────────────────────────────────
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    needs: dependencies

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restaurar cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências (fallback)
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar testes unitários com cobertura
        run: npm run test:cov
        env:
          JWT_SECRET: test-secret-for-ci
          ANTHROPIC_API_KEY: test-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mentistech_test

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────
  # JOB 3 — Build TypeScript
  # ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restaurar cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências (fallback)
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: Compilar aplicação
        run: npm run build

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ─────────────────────────────────────
  # JOB 4 — Documentação
  # ─────────────────────────────────────
  docs:
    name: Documentação
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restaurar cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências (fallback)
        run: npm ci

      - name: Publicar API.md como artefato de documentação
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: API.md
          retention-days: 30

      - name: Exibir resumo da documentação no job summary
        run: |
          echo "## Documentação da API MentisTech" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Arquivo \`API.md\` gerado com sucesso e disponível como artefato." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints disponíveis:" >> $GITHUB_STEP_SUMMARY
          grep "^## " API.md >> $GITHUB_STEP_SUMMARY || true
