name: MentisTech CD — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy" para confirmar o deploy em produção'
        required: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────
  # JOB 0 — Validar confirmação manual
  # ─────────────────────────────────────
  validate-input:
    name: Validar confirmação (workflow_dispatch)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Verificar confirmação
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmação inválida. Digite exatamente 'deploy' para prosseguir."
            exit 1
          fi

  # ─────────────────────────────────────
  # JOB 1 — Build e push da imagem Docker
  # ─────────────────────────────────────
  build-and-push:
    name: Build e push imagem (production)
    runs-on: ubuntu-latest
    needs: [validate-input]
    if: always() && (needs.validate-input.result == 'success' || needs.validate-input.result == 'skipped')
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=prod-,format=short
            type=raw,value=latest

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────
  # JOB 2 — Deploy no servidor de produção
  # ─────────────────────────────────────
  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy via SSH no servidor de produção
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e

            echo "==> Autenticando no registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Puxando nova imagem..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Rodando migrations..."
            docker run --rm \
              --env DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              npx prisma migrate deploy

            echo "==> Reiniciando container com zero downtime..."
            docker stop mentistech-production 2>/dev/null || true
            docker rm   mentistech-production 2>/dev/null || true
            docker run -d \
              --name mentistech-production \
              --restart unless-stopped \
              -p 3000:3000 \
              --env NODE_ENV=production \
              --env DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}" \
              --env JWT_SECRET="${{ secrets.PRODUCTION_JWT_SECRET }}" \
              --env ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --env FRONTEND_URL="${{ vars.PRODUCTION_FRONTEND_URL }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Aguardando health check..."
            sleep 15
            docker exec mentistech-production \
              wget -qO- http://localhost:3000/health || exit 1

            echo "==> Limpando imagens antigas..."
            docker image prune -f

            echo "==> Deploy de produção concluído com sucesso!"

      - name: Resumo do deploy no job summary
        run: |
          echo "## Deploy Production — Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ needs.build-and-push.outputs.image_digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ vars.PRODUCTION_URL }} |" >> $GITHUB_STEP_SUMMARY
